<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Implementación y Evaluación del RED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2ead9; --card:#fbf7ee; --ink:#241f18; --muted:#6e6353;
    --forest:#33503f; --clay:#a1382a; --ochre:#c1852c; --line:#ddd2ba;
    --accent:#a1382a; --accent-rgb:161,56,42;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1712; --card:#241f18; --ink:#f2ead9; --muted:#b4a892;
      --forest:#7fae95; --clay:#e17a63; --ochre:#e3a24f; --line:#3b3327;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1712; --card:#241f18; --ink:#f2ead9; --muted:#b4a892;
    --forest:#7fae95; --clay:#e17a63; --ochre:#e3a24f; --line:#3b3327;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100%; color:var(--ink);
    font-family:'Karla',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));
    background:
      radial-gradient(720px 480px at 12% -8%, rgba(var(--accent-rgb),.16), transparent 60%),
      radial-gradient(640px 520px at 108% 92%, rgba(var(--accent-rgb),.12), transparent 60%),
      var(--bg);
    transition:background .7s ease;
    overflow-x:hidden;
  }

  .stage{width:100%; max-width:760px; display:flex; flex-direction:column; flex:1;}

  .progress{width:100%; height:3px; background:var(--line); border-radius:2px; overflow:hidden; margin-bottom:22px;}
  .progress-bar{height:100%; width:11.11%; background:var(--accent); transition:width .55s cubic-bezier(.65,0,.35,1), background .5s ease;}

  .deck{position:relative; flex:1; min-height:440px; perspective:1400px;}

  .slide{
    position:absolute; inset:0;
    background:var(--card); border:1px solid var(--line); border-radius:4px;
    padding:44px 46px 40px; display:flex; flex-direction:column; justify-content:center;
    opacity:0; transform:translateY(22px) scale(.985); pointer-events:none;
    transition:opacity .55s cubic-bezier(.22,.9,.35,1), transform .6s cubic-bezier(.22,.9,.35,1), border-top-color .5s ease;
    border-top:4px solid var(--accent);
    overflow:hidden;
  }
  .slide.active{opacity:1; transform:translateY(0) scale(1);}
  .slide.leaving{opacity:0; transform:translateY(-16px) scale(.985);}

  /* --- fondos ilustrados: manchas de color + patrón + motivo grande, sin imágenes externas --- */
  .blob{position:absolute; border-radius:50%; filter:blur(46px); opacity:.5; pointer-events:none; z-index:0;}
  .blob-a{width:260px; height:260px; background:var(--accent); top:-90px; left:-70px; animation:drift1 16s ease-in-out infinite;}
  .blob-b{width:220px; height:220px; background:var(--accent); bottom:-80px; right:-60px; opacity:.3; animation:drift2 19s ease-in-out infinite;}
  @keyframes drift1{0%,100%{transform:translate(0,0);}50%{transform:translate(26px,18px);}}
  @keyframes drift2{0%,100%{transform:translate(0,0);}50%{transform:translate(-22px,-16px);}}

  .pattern{position:absolute; inset:0; z-index:0; opacity:.06;
    background-image:repeating-linear-gradient(135deg, var(--accent) 0 2px, transparent 2px 26px),
                      repeating-linear-gradient(45deg, var(--accent) 0 2px, transparent 2px 26px);}

  .hero-motif{position:absolute; right:-34px; bottom:-34px; width:230px; height:230px; color:var(--accent);
    opacity:.14; z-index:0; animation:float 9s ease-in-out infinite; transform-origin:70% 70%;}
  @keyframes float{0%,100%{transform:rotate(-6deg) translateY(0);}50%{transform:rotate(-2deg) translateY(-10px);}}

  .content{position:relative; z-index:1;}

  .motif{position:absolute; top:22px; right:24px; width:54px; height:54px; color:var(--accent); z-index:2;}
  .slide.active .motif{animation:iconPop .6s cubic-bezier(.34,1.56,.64,1) both;}
  @keyframes iconPop{from{opacity:0; transform:scale(.4) rotate(-25deg);}to{opacity:1; transform:scale(1) rotate(0);}}

  .weave{position:absolute; left:0; right:0; bottom:0; height:10px; z-index:1;
    background:repeating-linear-gradient(115deg, var(--accent) 0 8px, transparent 8px 16px);
    opacity:.5;}

  .eyebrow{font-family:'Fraunces',Georgia,serif; font-style:italic; font-size:.98rem; color:var(--accent); margin:0 0 10px;}
  h1{font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:2.15rem; line-height:1.15; margin:0 0 14px; max-width:88%;}
  h2{font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:1.55rem; line-height:1.25; margin:0 0 22px; max-width:90%;}
  .sub{color:var(--muted); font-size:1.02rem; margin-bottom:6px; max-width:92%;}

  ul{margin:0; padding:0; list-style:none;}
  li{position:relative; padding-left:26px; margin-bottom:13px; font-size:1.03rem; line-height:1.55; max-width:94%;}
  li::before{content:""; position:absolute; left:0; top:.55em; width:9px; height:9px; background:var(--accent); border-radius:1px; transform:rotate(45deg);}
  li.note{color:var(--accent); font-style:italic;}
  li.note::before{background:transparent; border:1.5px solid var(--accent);}

  .refs p{font-size:.94rem; line-height:1.6; color:var(--muted); margin:0 0 12px; padding-left:0;}
  .refs p b{color:var(--ink); font-weight:600;}

  .gallery{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:4px;}
  .gallery-item{display:flex; flex-direction:column; gap:8px;}
  .gallery-item figure{margin:0; border-radius:6px; overflow:hidden; border:1px solid var(--line); aspect-ratio:4/3; background:var(--bg);}
  .gallery-item img{width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; transition:transform .35s ease;}
  .gallery-item img:hover{transform:scale(1.04);}
  .gallery-item figcaption{font-size:.82rem; line-height:1.4; color:var(--muted);}

  .lightbox{position:fixed; inset:0; background:rgba(20,17,12,.88); z-index:50; display:flex; align-items:center; justify-content:center; padding:28px; opacity:0; pointer-events:none; transition:opacity .25s ease;}
  .lightbox.open{opacity:1; pointer-events:auto;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,.4);}
  .lightbox-close{position:absolute; top:22px; right:26px; background:none; border:none; color:#f2ead9; font-size:1.8rem; line-height:1; cursor:pointer; padding:6px 10px;}

  @media (max-width:600px){
    .gallery{grid-template-columns:1fr; gap:12px;}
  }

  /* entrada escalonada del contenido cada vez que la diapositiva se activa */
  .stg{opacity:0;}
  .slide.active .stg{animation:fadeUp .6s cubic-bezier(.22,.9,.35,1) both;}

  @keyframes fadeUp{from{opacity:0; transform:translateY(16px);}to{opacity:1; transform:translateY(0);}}

  .nav{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; max-width:760px; margin-top:20px; gap:14px;
  }
  .navbtn{
    background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:6px;
    padding:10px 20px; font-size:.92rem; font-family:'Karla',sans-serif; font-weight:600;
    cursor:pointer; transition:border-color .2s ease, transform .12s ease, box-shadow .2s ease;
  }
  .navbtn:hover:not(:disabled){border-color:var(--accent); box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15);}
  .navbtn:active:not(:disabled){transform:scale(.96);}
  .navbtn:disabled{opacity:.3; cursor:default;}

  .dots{display:flex; gap:7px;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--line); border:none; padding:0; cursor:pointer; transition:width .3s ease, background .3s ease, transform .2s ease;}
  .dot:hover{transform:scale(1.3);}
  .dot.on{background:var(--accent); width:20px; border-radius:4px;}

  .hint{color:var(--muted); font-size:.82rem; margin-top:14px; text-align:center; opacity:.75;}

  @media (prefers-reduced-motion: reduce){
    .blob, .hero-motif, .slide, .stg, .motif{animation:none !important; transition:none !important;}
  }

  @media (max-width:600px){
    .slide{padding:32px 26px 30px;}
    h1{font-size:1.7rem;}
    h2{font-size:1.3rem;}
    .motif{width:40px; height:40px; top:16px; right:18px;}
    .hero-motif{width:170px; height:170px;}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="progress"><div class="progress-bar" id="bar"></div></div>
  <div class="deck" id="deck"></div>
  <p class="hint" id="hint">Usa las flechas ← → del teclado, desliza en pantallas táctiles, o haz clic en los puntos</p>
</div>
<div class="nav">
  <button class="navbtn" id="prev">← Anterior</button>
  <div class="dots" id="dots"></div>
  <button class="navbtn" id="next">Siguiente →</button>
</div>

  { theme:'forest', icon:'lista', eyebrow:"Resultados de la evaluación",
    title:"Rúbrica diligenciada por estudiantes y docentes", bullets:[
    "Participantes: 7 estudiantes y 3 docentes de la I.E. Técnica La Palomera",
    "Nueve dimensiones evaluadas: diseño pedagógico, usabilidad, contenido, tecnología empleada, potencial transformador, interactividad, accesibilidad, sostenibilidad y escalabilidad, valor agregado",
    "Resultado: la totalidad de los participantes ubicó el recurso en el nivel Excelente en las nueve dimensiones, sin registros en Bueno o Regular",

  { theme:'ochre', icon:'libro', title:"Referencias", refs:[
    "<b>Aulaplaneta.</b> (2025, 13 de mayo). «El aprendizaje STEAM es significativo cuando conecta con la realidad»: La experiencia en el aula de Cristian Ruiz Reinales.",
    "<b>Donis de Santos, X. G.</b> (2025). Más allá de la sustitución: implementación y retos del modelo SAMR en contextos educativos. Revista Científica Avances en Ciencia y Docencia, 2(Especial), 55-64.",
    "<b>Flores-Vivar, J.-M., &amp; García-Peñalvo, F.-J.</b> (2023). Reflexiones sobre la ética, potencialidades y retos de la Inteligencia Artificial en el marco de la Educación de Calidad (ODS4). Comunicar, 31(74), 37-47.",
    "<b>Hurtado Moncada, M. J.</b> (2021). Acceso a las tecnologías digitales para mujeres indígenas rurales: Barreras, catalizadores y sueños. Documentos de Trabajo, Fundación Carolina."] }
];

const THEME_VAR = {clay:'--clay', forest:'--forest', ochre:'--ochre'};
const THEME_RGB = {clay:'161,56,42', forest:'51,80,63', ochre:'193,133,44'};

let i = 0;
const deck = document.getElementById('deck');
const dotsWrap = document.getElementById('dots');
const bar = document.getElementById('bar');
const root = document.documentElement;

// construir las diapositivas una sola vez en el DOM (mejor para animar)
slides.forEach((s, idx) => {
  const div = document.createElement('div');
  div.className = 'slide';
  div.dataset.theme = s.theme;

  let inner =
    '<div class="blob blob-a"></div><div class="blob blob-b"></div><div class="pattern"></div>' +
    '<div class="hero-motif">' + ICONS[s.icon] + '</div>' +
    '<div class="motif">' + ICONS[s.icon] + '</div>' +
    '<div class="content">';

  let n = 0;
  const stg = () => 'stg" style="animation-delay:' + (n++ * 70) + 'ms';

  if (s.eyebrow) inner += '<p class="eyebrow ' + stg() + '">' + s.eyebrow + '</p>';

  if (idx === 0) {
    inner += '<h1 class="' + stg() + '">' + s.title + '</h1>';
    s.sub.forEach(t => inner += '<div class="sub ' + stg() + '">' + t + '</div>');
  } else if (s.refs) {
    inner += '<h2 class="' + stg() + '">' + s.title + '</h2><div class="refs">';
    s.refs.forEach(r => inner += '<p class="' + stg() + '">' + r + '</p>');
    inner += '</div>';
  } else if (s.images) {
    inner += '<h2 class="' + stg() + '">' + s.title + '</h2><div class="gallery ' + stg() + '">';
    s.images.forEach(im => {
      inner += '<div class="gallery-item"><figure><img src="' + im.src + '" alt="' + im.caption + '" loading="lazy" data-full="' + im.src + '"></figure><figcaption>' + im.caption + '</figcaption></div>';
    });
    inner += '</div>';
  } else {
    inner += '<h2 class="' + stg() + '">' + s.title + '</h2><ul>';
    s.bullets.forEach(b => {
      if (typeof b === 'object') inner += '<li class="note ' + stg() + '">' + b.note + '</li>';
      else inner += '<li class="' + stg() + '">' + b + '</li>';
    });
    inner += '</ul>';
  }
  inner += '</div><div class="weave"></div>';
  div.innerHTML = inner;
  deck.appendChild(div);

  const dot = document.createElement('button');
  dot.className = 'dot';
  dot.setAttribute('aria-label', 'Ir a la diapositiva ' + (idx + 1));
  dot.onclick = () => go(idx);
  dotsWrap.appendChild(dot);
});

const slideEls = [...deck.children];
const dotEls = [...dotsWrap.children];

function render(prevIndex){
  slideEls.forEach((el, idx) => {
    el.classList.toggle('active', idx === i);
    el.classList.toggle('leaving', idx === prevIndex && prevIndex !== i);
  });
  dotEls.forEach((d, idx) => d.classList.toggle('on', idx === i));
  bar.style.width = ((i + 1) / slides.length * 100) + '%';
  const theme = slides[i].theme;
  root.style.setProperty('--accent', 'var(' + THEME_VAR[theme] + ')');
  root.style.setProperty('--accent-rgb', THEME_RGB[theme]);
  document.getElementById('prev').disabled = (i === 0);
  document.getElementById('next').disabled = (i === slides.length - 1);
}

function go(n){
  if (n < 0 || n > slides.length - 1 || n === i) return;
  const prev = i;
  i = n;
  render(prev);
}

document.getElementById('prev').onclick = () => go(i - 1);
document.getElementById('next').onclick = () => go(i + 1);
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') go(i + 1);
  if (e.key === 'ArrowLeft') go(i - 1);
  if (e.key === 'Home') go(0);
  if (e.key === 'End') go(slides.length - 1);
});

// deslizar con el dedo en pantallas táctiles
let touchX = null;
deck.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, {passive:true});
deck.addEventListener('touchend', (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (dx < -40) go(i + 1);
  if (dx > 40) go(i - 1);
  touchX = null;
}, {passive:true});

// leve efecto parallax: el fondo grande sigue el cursor
const stage = document.querySelector('.stage');
stage.addEventListener('mousemove', (e) => {
  const active = deck.querySelector('.slide.active .hero-motif');
  if (!active) return;
  const r = deck.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width - .5;
  const py = (e.clientY - r.top) / r.height - .5;
  active.style.transform = 'translate(' + (px * -14) + 'px,' + (py * -10) + 'px)';
});
stage.addEventListener('mouseleave', () => {
  const active = deck.querySelector('.slide.active .hero-motif');
  if (active) active.style.transform = '';
});

render(-1);

// lightbox para ampliar las fotos de la diapositiva de galería
const lightbox = document.createElement('div');
lightbox.className = 'lightbox';
lightbox.innerHTML = '<button class="lightbox-close" aria-label="Cerrar">&times;</button><img alt="">';
document.body.appendChild(lightbox);
const lightboxImg = lightbox.querySelector('img');
function openLightbox(src, alt){
  lightboxImg.src = src;
  lightboxImg.alt = alt;
  lightbox.classList.add('open');
}
function closeLightbox(){ lightbox.classList.remove('open'); }
deck.addEventListener('click', (e) => {
  const img = e.target.closest('.gallery-item img');
  if (img) openLightbox(img.dataset.full, img.alt);
});
lightbox.addEventListener('click', closeLightbox);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

// ocultar la pista de navegación tras la primera interacción
let hinted = false;
function dismissHint(){
  if (hinted) return; hinted = true;
  const h = document.getElementById('hint');
  h.style.transition = 'opacity .5s ease';
  h.style.opacity = '0';
}
['keydown','touchstart','mousedown'].forEach(ev => document.addEventListener(ev, dismissHint, {once:true}));
</script>
